name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev gettext patch build-essential ccache

      - name: Install Buildozer & Locked Cython
        run: |
          python -m pip install --upgrade "pip<24.1" "setuptools<70" wheel
          python -m pip install --upgrade buildozer "cython==0.29.36" virtualenv

      - name: Verify Files Before Build
        run: |
          ls -la
          test -f main.py || (echo "ERROR: main.py tidak ditemukan!" && exit 1)
          test -f buildozer.spec || (echo "ERROR: buildozer.spec tidak ditemukan!" && exit 1)

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kasir-warung-apk
          path: bin/*.apk
          if-no-files-found: error
